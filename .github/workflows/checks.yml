name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.0.0", "20", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # tsup needs a newer Node than the package supports, so build on 24 and
      # run the tests against that build on each supported version.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: bun run test:dist
