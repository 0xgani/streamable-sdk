# Publishes to npm with trusted publishing (OIDC): no npm token or 2FA code needed.
# Release: bump "version" in package.json, commit, then `git tag v<version> && git push --tags`.
name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (and provenance)

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: bun install --frozen-lockfile

      # prepublishOnly also runs these; they're explicit here so failures are easy to spot.
      - run: bun run typecheck
      - run: bun run build

      - name: Smoke-test the CLI on Node
        run: node dist/cli.js --help

      - run: npm publish
